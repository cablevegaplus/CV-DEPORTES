<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conntroller CV</title>
    <style>
        body {
            margin: 0; padding: 15px;
            font-family: 'Segoe UI', sans-serif;
            background-color: #1a1a1a; color: white;
        }

        h2 { margin-top: 0; color: #FFD700; border-bottom: 2px solid #333; padding-bottom: 10px; font-size: 20px;}

        #status-indicator {
            padding: 8px; background: #333; color: #FFD700; text-align: center;
            border-radius: 4px; font-weight: bold; margin-bottom: 15px; font-size: 13px;
        }

        .control-section { background-color: #2a2a2a; padding: 15px; border-radius: 8px; border: 1px solid #333; margin-bottom: 15px;}
        .control-section h3 { margin-top: 0; border-bottom: 2px solid #444; padding-bottom: 5px; color: #FFD700; font-size: 16px;}

        .input-group { margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between;}
        .input-group label { font-size: 13px; }
        .input-group input[type="text"], .input-group input[type="number"], select {
            padding: 6px; border: none; border-radius: 4px; background: #444; color: white; width: 55%; font-size: 14px;
        }
        
        .btn-group { display: flex; gap: 5px; width: 55%; justify-content: flex-end;}
        .btn-group button { background-color: #444; color: white; border: none; padding: 8px 15px; cursor: pointer; border-radius: 4px; font-weight: bold; font-size: 16px;}
        
        .btn-action { width: 100%; padding: 12px; margin-top: 10px; color: white; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; font-size: 14px;}
        .btn-action.red { background-color: #dc3545; }
        .btn-action.green { background-color: #28a745; }
        .btn-action.orange { background-color: #fd7e14; }

        .radio-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 15px; }
        .radio-group label {
            display: flex; align-items: center; background-color: #444; padding: 8px 10px;
            border-radius: 4px; cursor: pointer; font-size: 13px;
        }
        .radio-group input[type="radio"] { margin-right: 10px; }

        .hidden { display: none !important; }
        .pen-btn { padding: 8px; font-size: 14px; flex: 1; border: 1px solid #444; cursor:pointer;}
        .pen-btn.act-pend { background: #666; color: white;}
        .pen-btn.act-hit { background: #28a745; color: white;}
        .pen-btn.act-miss { background: #dc3545; color: white;}
    </style>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

    <h2>CableVega Deportes</h2>
    <div id="status-indicator">📡 Conectando con el Celular Transmisor...</div>

    <div class="control-section">
        <h3>Equipos y Goles</h3>
        <div class="input-group">
            <label>Eq 1 (Local):</label>
            <input type="text" id="c-team1-name" value="CARMEL" onkeyup="sendBoardState()">
        </div>
        <div class="input-group">
            <label>Color 1:</label>
            <input type="color" id="c-team1-color" value="#0000FF" onchange="sendBoardState()">
        </div>
        <div class="input-group">
            <label>Goles 1:</label>
            <div class="btn-group">
                <button onclick="changeScore(1, -1)">-</button>
                <button onclick="changeScore(1, 1)" style="background-color: #28a745;">+ GOL</button>
            </div>
        </div>

        <hr style="border-color:#444; margin: 10px 0;">

        <div class="input-group">
            <label>Eq 2 (Visita):</label>
            <input type="text" id="c-team2-name" value="SALINAS" onkeyup="sendBoardState()">
        </div>
        <div class="input-group">
            <label>Color 2:</label>
            <input type="color" id="c-team2-color" value="#FF0000" onchange="sendBoardState()">
        </div>
        <div class="input-group">
            <label>Goles 2:</label>
            <div class="btn-group">
                <button onclick="changeScore(2, -1)">-</button>
                <button onclick="changeScore(2, 1)" style="background-color: #28a745;">+ GOL</button>
            </div>
        </div>
        
        <button class="btn-action green" id="btn-toggle-board" onclick="toggleBoard()">▶ MOSTRAR EN PANTALLA</button>
    </div>

    <div class="control-section">
        <h3>Reloj y Período</h3>
        <div class="input-group">
            <label>Período:</label>
            <input type="text" id="c-period" value="1T" onkeyup="sendBoardState()">
        </div>
        <div class="input-group">
            <label>Reposición (+):</label>
            <input type="number" id="c-added-time" value="0" onchange="sendBoardState()" onkeyup="sendBoardState()">
        </div>
        <div class="input-group" style="margin-top:10px;">
            <label>Min / Seg:</label>
            <div class="btn-group" style="width:55%;">
                <input type="number" id="c-time-min" value="0" style="width:45%;">
                <input type="number" id="c-time-sec" value="0" max="59" style="width:45%;">
            </div>
        </div>
        <button class="btn-action" style="background:#555; padding: 8px;" onclick="setTimer()">Fijar Tiempo</button>
        <div style="display:flex; gap:10px;">
            <button class="btn-action green" id="btn-timer-start" onclick="startTimer()">Iniciar</button>
            <button class="btn-action red" onclick="stopTimer()">Pausar</button>
        </div>
    </div>

    <div class="control-section">
        <h3>Eventos (Plegable)</h3>
        <div class="radio-group">
            <label><input type="radio" name="event_type" value="sub" onchange="toggleEventFields()" checked> 🔄 Sustitución</label>
            <label><input type="radio" name="event_type" value="yellow" onchange="toggleEventFields()"> 🟨 Tarjeta Amarilla</label>
            <label><input type="radio" name="event_type" value="red" onchange="toggleEventFields()"> 🟥 Tarjeta Roja Directa</label>
            <label><input type="radio" name="event_type" value="double" onchange="toggleEventFields()"> 🟨+🟨 Doble Amarilla</label>
        </div>

        <div id="fields-sub">
            <div class="input-group"><label>Sale (#):</label><input type="number" id="c-sub-out-num"></div>
            <div class="input-group"><label>Nombre:</label><input type="text" id="c-sub-out-name"></div>
            <div class="input-group"><label>Entra (#):</label><input type="number" id="c-sub-in-num"></div>
            <div class="input-group"><label>Nombre:</label><input type="text" id="c-sub-in-name"></div>
        </div>

        <div id="fields-card" class="hidden">
            <div class="input-group"><label>Número:</label><input type="number" id="c-card-num"></div>
            <div class="input-group"><label>Nombre:</label><input type="text" id="c-card-name"></div>
        </div>

        <button class="btn-action green" id="btn-toggle-event" onclick="toggleEventMenu()">▼ DESPLEGAR EVENTO</button>
    </div>

    <div class="control-section">
        <h3>Tanda de Penales</h3>
        <button class="btn-action orange" style="margin-top:0; margin-bottom: 10px;" id="btn-toggle-penalties" onclick="togglePenalties()">ACTIVAR PENALES</button>
        <button class="btn-action" style="background-color: #6c757d; padding: 6px; margin-bottom: 15px;" onclick="resetPenalties()">↻ Limpiar</button>

        <div style="display:flex; justify-content:space-between; gap:10px;">
            <div style="width:50%;">
                <h4 style="margin:0 0 10px 0; text-align:center;">Equipo 1</h4>
                <div id="pen-controls-t1"></div>
            </div>
            <div style="width:50%;">
                <h4 style="margin:0 0 10px 0; text-align:center;">Equipo 2</h4>
                <div id="pen-controls-t2"></div>
            </div>
        </div>
    </div>

    <script>
        const peer = new Peer();
        let conn = null;

        peer.on('open', () => {
            connectToViewer();
        });

        function connectToViewer() {
            conn = peer.connect('cablevega-match-live');
            conn.on('open', () => {
                document.getElementById('status-indicator').innerText = "🟢 CONECTADO EN VIVO A LA CÁMARA";
                document.getElementById('status-indicator').style.color = "#44FF44";
                sendBoardState();
            });
            conn.on('close', () => {
                document.getElementById('status-indicator').innerText = "🔴 DESCONECTADO (Reintentando...)";
                document.getElementById('status-indicator').style.color = "#FF4444";
                setTimeout(connectToViewer, 2000);
            });
        }

        let score1 = 0; let score2 = 0;
        let isBoardVisible = false; let isEventVisible = false; let isPenaltiesVisible = false;
        let timerInterval = null; let totalSeconds = 0;
        let penData1 = ['pending','pending','pending','pending','pending'];
        let penData2 = ['pending','pending','pending','pending','pending'];

        buildPenaltyControls();

        function emit(payload) {
            if (conn && conn.open) conn.send(payload);
        }

        function sendBoardState() {
            emit({
                type: 'UPDATE_BOARD',
                t1Name: document.getElementById('c-team1-name').value,
                t2Name: document.getElementById('c-team2-name').value,
                t1Color: document.getElementById('c-team1-color').value,
                t2Color: document.getElementById('c-team2-color').value,
                score1: score1,
                score2: score2,
                period: document.getElementById('c-period').value.toUpperCase(),
                time: formatTime(totalSeconds),
                addedTime: parseInt(document.getElementById('c-added-time').value) || 0
            });
        }

        function toggleBoard() {
            isBoardVisible = !isBoardVisible;
            const btn = document.getElementById('btn-toggle-board');
            btn.innerText = isBoardVisible ? "■ OCULTAR DE PANTALLA" : "▶ MOSTRAR EN PANTALLA";
            btn.className = isBoardVisible ? "btn-action red" : "btn-action green";
            
            emit({ type: 'TOGGLE_BOARD', visible: isBoardVisible });
            sendBoardState();
        }

        function changeScore(team, amount) {
            if (team === 1) {
                score1 = Math.max(0, score1 + amount);
                if (amount > 0) emit({ type: 'GOAL_ANIM', team: 1, color: document.getElementById('c-team1-color').value });
            } else {
                score2 = Math.max(0, score2 + amount);
                if (amount > 0) emit({ type: 'GOAL_ANIM', team: 2, color: document.getElementById('c-team2-color').value });
            }
            sendBoardState();
        }

        function toggleEventFields() {
            const type = document.querySelector('input[name="event_type"]:checked').value;
            if (type === 'sub') {
                document.getElementById('fields-sub').classList.remove('hidden');
                document.getElementById('fields-card').classList.add('hidden');
            } else {
                document.getElementById('fields-sub').classList.add('hidden');
                document.getElementById('fields-card').classList.remove('hidden');
            }
        }

        function toggleEventMenu() {
            isEventVisible = !isEventVisible;
            const btn = document.getElementById('btn-toggle-event');
            btn.innerText = isEventVisible ? "▲ OCULTAR EVENTO" : "▼ DESPLEGAR EVENTO";
            btn.className = isEventVisible ? "btn-action red" : "btn-action green";

            let html = '';
            const type = document.querySelector('input[name="event_type"]:checked').value;
            if (type === 'sub') {
                html = `<div class="sub-row sub-out"><span class="sub-arrow">▼</span><div class="player-info"><span class="player-num">${document.getElementById('c-sub-out-num').value}</span><span class="player-name">${document.getElementById('c-sub-out-name').value}</span></div></div>
                        <div class="sub-row sub-in"><span class="sub-arrow">▲</span><div class="player-info"><span class="player-num">${document.getElementById('c-sub-in-num').value}</span><span class="player-name">${document.getElementById('c-sub-in-name').value}</span></div></div>`;
            } else if (type === 'yellow' || type === 'red') {
                html = `<div class="card-icon ${type === 'yellow' ? 'card-yellow' : 'card-red'}"></div><div class="player-info"><span class="player-num">${document.getElementById('c-card-num').value}</span><span class="player-name">${document.getElementById('c-card-name').value}</span></div>`;
            } else if (type === 'double') {
                html = `<div class="double-yellow-container fuse-anim"><div class="card-dy1"></div><div class="card-dy2"></div></div><div class="player-info"><span class="player-num">${document.getElementById('c-card-num').value}</span><span class="player-name">${document.getElementById('c-card-name').value}</span></div>`;
            }

            emit({ type: 'TOGGLE_EVENT', visible: isEventVisible, html: html });
        }

        function buildPenaltyControls() {
            const t1 = document.getElementById('pen-controls-t1');
            const t2 = document.getElementById('pen-controls-t2');
            t1.innerHTML = ''; t2.innerHTML = '';

            for(let i=0; i<5; i++) {
                t1.innerHTML += `<div style="display:flex; margin-bottom:4px;">
                    <button class="pen-btn ${penData1[i]=='pending'?'act-pend':''}" onclick="setPen(1,${i},'pending')">-</button>
                    <button class="pen-btn ${penData1[i]=='hit'?'act-hit':''}" onclick="setPen(1,${i},'hit')">✅</button>
                    <button class="pen-btn ${penData1[i]=='miss'?'act-miss':''}" onclick="setPen(1,${i},'miss')">❌</button>
                </div>`;
                t2.innerHTML += `<div style="display:flex; margin-bottom:4px;">
                    <button class="pen-btn ${penData2[i]=='pending'?'act-pend':''}" onclick="setPen(2,${i},'pending')">-</button>
                    <button class="pen-btn ${penData2[i]=='hit'?'act-hit':''}" onclick="setPen(2,${i},'hit')">✅</button>
                    <button class="pen-btn ${penData2[i]=='miss'?'act-miss':''}" onclick="setPen(2,${i},'miss')">❌</button>
                </div>`;
            }
        }

        function setPen(team, index, status) {
            if(team === 1) penData1[index] = status;
            else penData2[index] = status;
            buildPenaltyControls();
            emit({ type: 'UPDATE_PENALTIES', team: team, dots: team === 1 ? penData1 : penData2 });
        }

        function resetPenalties() {
            penData1 = ['pending','pending','pending','pending','pending'];
            penData2 = ['pending','pending','pending','pending','pending'];
            buildPenaltyControls();
            emit({ type: 'UPDATE_PENALTIES', team: 1, dots: penData1 });
            emit({ type: 'UPDATE_PENALTIES', team: 2, dots: penData2 });
        }

        function togglePenalties() {
            isPenaltiesVisible = !isPenaltiesVisible;
            const btn = document.getElementById('btn-toggle-penalties');
            btn.innerText = isPenaltiesVisible ? "DESACTIVAR PENALES" : "ACTIVAR PENALES";
            btn.className = isPenaltiesVisible ? "btn-action red" : "btn-action orange";
            emit({ type: 'TOGGLE_PENALTIES', visible: isPenaltiesVisible });
        }

        function formatTime(secs) {
            const m = Math.floor(secs / 60).toString().padStart(2, '0');
            const s = (secs % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }
        function setTimer() {
            totalSeconds = (parseInt(document.getElementById('c-time-min').value) || 0) * 60 + (parseInt(document.getElementById('c-time-sec').value) || 0);
            sendBoardState();
        }
        function startTimer() {
            if (timerInterval) return;
            timerInterval = setInterval(() => { totalSeconds++; sendBoardState(); }, 1000);
        }
        function stopTimer() {
            clearInterval(timerInterval); timerInterval = null;
        }
    </script>
</body>
</html>
